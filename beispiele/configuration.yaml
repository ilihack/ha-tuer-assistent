# Die Integration braucht in configuration.yaml nichts: einrichten über Einstellungen → Geräte & Dienste → Integration hinzufügen →
# Tür-Assistent (Namen, Begrüßung, Anweisung, xAI-Schlüssel, Türstation), ändern dort unter „Konfigurieren“. Nur das Log:

logger:
  logs:
    custom_components.tuer_assistent: info   # Anmeldung, Annahme und Ende jedes Rufs mit Grund (wenige Zeilen)
