# Qualitätsskala von Home Assistant, angewandt auf den Tür-Assistenten (Stand 12.11.2026, Version 2.3.0).
# Eigene Integrationen bekommen keine Stufe; die Regeln dienen hier als Prüfliste (Wort des Betreibers vom 12.11.2026: „Schau auch, was Home
# Assistant für Gold-Integration verlangt und was davon sinnvoll für uns ist“; dann: „wenn es nicht komplex ist, können wir die
# anderen Qualitätsmerkmale integrieren“). Offen ist nur, was eine Einrichtung über die Oberfläche braucht (config-flow und die fünf
# Regeln, die daran hängen): Das ist eine eigene Entscheidung, weil Schlüssel und Passwort dann nicht mehr in secrets.yaml stehen.
# status: done = erfüllt, exempt = gilt hier nicht oder ist bewusst nicht gewollt (mit Grund), todo = sinnvoll und offen.
# Regeln: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules
rules:
  # --- Bronze ---
  action-setup:
    status: done
    comment: Der Dienst tuer_assistent.auflegen wird in async_setup angemeldet.
  appropriate-polling:
    status: done
    comment: Nur der Sensor „Empfang Störung“ fragt nach, alle 30 s und nur den eigenen Zustand; den Schlüssel prüft die Integration stündlich.
  brands:
    status: done
    comment: Eigenes Symbol in brand/ (icon.png 256 px, icon@2x.png 512 px); so zeigt es Home Assistant ab 2026.3 und so prüft es HACS.
  common-modules:
    status: exempt
    comment: Kein Koordinator und keine Basis-Entität; fünf Entitäten ohne gemeinsamen Abruf.
  config-flow:
    status: exempt
    comment: Einrichtung in configuration.yaml mit !secret (Schlüssel, Station, Passwort). Der Eintrag entsteht nur, damit Home Assistant die Entitäten annimmt. Umstellen nur auf des Betreibers Entscheidung (offen.md, Punkt 259).
  config-flow-test-coverage:
    status: exempt
    comment: Der Ablauf hat keine Maske.
  dependency-transparency:
    status: done
    comment: Keine fremden Pakete; SIP, RTP und Digest stehen in sprache.py.
  docs-actions:
    status: done
    comment: README und services.yaml.
  docs-conditions:
    status: exempt
    comment: Keine Bedingungen.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: done
  docs-triggers:
    status: exempt
    comment: Keine Geräte-Auslöser; die drei Ereignisse stehen im README.
  entity-event-setup:
    status: done
    comment: Die Entitäten melden sich für nichts an, was sie wieder abmelden müssten.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
    comment: Name aus Gerät „Empfang“ und Entität („Störung“, „KI“ …); die Kennungen (binary_sensor.empfang_stoerung …) bleiben fest.
  runtime-data:
    status: exempt
    comment: Der Zustand liegt in hass.data, weil die Innenstation aus configuration.yaml startet, bevor es den Eintrag gibt. Käme mit config-flow.
  test-before-configure:
    status: exempt
    comment: Keine Maske; siehe test-before-setup.
  test-before-setup:
    status: done
    comment: Schlüssel, Station oder Passwort fehlen, Port belegt, Station nicht auflösbar → Warnung im Log, Sensor „Empfang Störung“ an. Den Schlüssel prüft die Integration gleich beim Start bei xAI.
  unique-config-entry:
    status: done
    comment: single_config_entry und feste unique_id.
  # --- Silber ---
  action-exceptions:
    status: done
    comment: tuer_assistent.auflegen wirft nur, wenn Auflegen gar nicht geht (HomeAssistantError mit Übersetzung); ohne Gespräch geschieht nichts. Die Automation ruft mit continue_on_error.
  config-entry-unloading:
    status: done
    comment: Die Entitäten werden entladen. Die Innenstation gehört zu configuration.yaml und meldet sich beim Anhalten von Home Assistant ab.
  docs-configuration-parameters:
    status: done
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: exempt
    comment: Der Sensor meldet die Störung selbst (an, mit Grund); „nicht verfügbar“ würde die Plakette verschlucken.
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: Anmeldung verloren und wieder da, Schlüssel abgelehnt und wieder gut, je einmal im Log.
  parallel-updates:
    status: done
  reauthentication-flow:
    status: exempt
    comment: Der Schlüssel steht in secrets.yaml; ein abgelehnter Schlüssel erscheint unter Reparaturen mit dem, was zu tun ist. Käme mit config-flow.
  test-coverage:
    status: done
    comment: Die Tests liegen im Prüfstand der Anlage (pruefung/tests/test_grok_voice.py, test_tuer_assistent.py und weitere), mit gestellter Station und gestelltem xAI.
  # --- Gold ---
  devices:
    status: done
    comment: Ein Gerät „Empfang“ (Dienst) für alle Entitäten.
  diagnostics:
    status: done
    comment: diagnostics.py, ohne Schlüssel, Passwort, Adresse, Namen und Mitschriften; mit dem Tagebuch der letzten Rufe.
  discovery:
    status: exempt
    comment: Eine Station, fest eingetragen; ihr Passwort lässt sich nicht finden.
  discovery-update-info:
    status: exempt
    comment: Wie discovery.
  docs-data-update:
    status: done
  docs-examples:
    status: done
    comment: Ordner beispiele im Projekt (configuration.yaml, Anweisung, Helfer, Automationen).
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: done
  dynamic-devices:
    status: exempt
    comment: Genau ein Gerät.
  entity-category:
    status: done
    comment: Störung = Diagnose, Wahl der KI = Einstellung.
  entity-device-class:
    status: done
    comment: Störung = problem.
  entity-disabled-by-default:
    status: done
    comment: Erkennung, Stimme und Agent gehören zum Weg über einen VoIP Stack und sind bei neuen Einrichtungen aus; Grok Voice braucht sie nicht.
  entity-translations:
    status: done
    comment: Namen deutsch und englisch in translations/.
  exception-translations:
    status: done
    comment: Der eine Fehler (Auflegen nicht möglich) deutsch und englisch in translations/.
  icon-translations:
    status: done
    comment: Symbole der Entitäten und des Dienstes in icons.json.
  reconfiguration-flow:
    status: exempt
    comment: Einstellungen in configuration.yaml. Käme mit config-flow.
  repair-issues:
    status: done
    comment: xAI-Schlüssel abgelehnt oder gesperrt; Anmeldung an der Station verloren (beide verschwinden von selbst); dass Mitschriften gespeichert werden (Warnung, lässt sich ignorieren).
  stale-devices:
    status: exempt
    comment: Genau ein Gerät.
  # --- Platin ---
  async-dependency:
    status: done
    comment: Keine fremden Pakete, alles asyncio.
  inject-websession:
    status: done
    comment: Die Sitzung von Home Assistant (async_get_clientsession).
  strict-typing:
    status: exempt
    comment: Typangaben stehen an den Schnittstellen; eine strenge Prüfung mit mypy läuft im Prüfstand der Anlage nicht.
