# Qualitätsskala von Home Assistant, angewandt auf den Tür-Assistenten (Stand 14.11.2026, Version 2.6.0).
# Eigene Integrationen bekommen keine Stufe; die Regeln dienen hier als Prüfliste (Wort des Betreibers vom 12.11.2026: „Schau auch, was Home
# Assistant für Gold-Integration verlangt und was davon sinnvoll für uns ist“; dann: „wenn es nicht komplex ist, können wir die
# anderen Qualitätsmerkmale integrieren“). Offen ist die Testabdeckung der Module des alten Text-Wegs. Alle Einstellungen (Namen,
# Begrüßung, Anweisung, Schlüssel, Türstation) stehen seit 2.6.0 in den Optionen des Eintrags (.storage/core.config_entries), nicht
# mehr in Helfern, im Tür-Agenten oder in secrets.yaml.
# status: done = erfüllt, exempt = gilt hier nicht oder ist bewusst nicht gewollt (mit Grund), todo = sinnvoll und offen.
# Bronze erfüllt; für Silber fehlt die Testabdeckung, für Platin die strenge Typprüfung.
# Regeln: https://developers.home-assistant.io/docs/core/integration-quality-scale/rules
rules:
  # --- Bronze ---
  action-setup:
    status: done
    comment: Der Dienst tuer_assistent.auflegen wird in async_setup angemeldet.
  appropriate-polling:
    status: done
    comment: Nur der Sensor „Empfang Störung“ fragt nach, alle 30 s und nur den eigenen Zustand; den Schlüssel prüft die Integration stündlich.
  brands:
    status: done
    comment: Eigenes Symbol in brand/ (icon.png 256 px, icon@2x.png 512 px); so zeigt es Home Assistant ab 2026.3 und so prüft es HACS.
  common-modules:
    status: exempt
    comment: Kein Koordinator und keine Basis-Entität; fünf Entitäten ohne gemeinsamen Abruf.
  config-flow:
    status: done
    comment: „Integration hinzufügen“ führt gleich in die Maske, „Konfigurieren“ am Eintrag ändert alles ohne Neustart von Home Assistant; oben die Namen, darunter Begrüßung und Anweisung, xAI, Türstation (Schlüssel und Passwort als Passwortfelder, nie vorbelegt). Ein Block grok_voice in configuration.yaml wird einmal übernommen, danach ignoriert (Hinweis unter Reparaturen).
  config-flow-test-coverage:
    status: done
    comment: pruefung/tests/test_oberflaeche.py deckt config_flow.py vollständig ab (pytest-cov, 14.11.2026).
  dependency-transparency:
    status: done
    comment: Keine fremden Pakete; SIP, RTP und Digest stehen in sprache.py.
  docs-actions:
    status: done
    comment: README und services.yaml.
  docs-conditions:
    status: exempt
    comment: Keine Bedingungen.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-removal-instructions:
    status: done
  docs-triggers:
    status: exempt
    comment: Keine Geräte-Auslöser; die drei Ereignisse stehen im README.
  entity-event-setup:
    status: done
    comment: Die Entitäten melden sich für nichts an, was sie wieder abmelden müssten.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
    comment: Name aus Gerät „Empfang“ und Entität („Störung“, „KI“ …); die Kennungen (binary_sensor.empfang_stoerung …) bleiben fest.
  runtime-data:
    status: exempt
    comment: Der Zustand liegt in hass.data, weil Werkzeuge und Dienst (async_setup) auch ohne Eintrag laufen und Grok Voice beim ersten Start aus configuration.yaml startet, bevor es den Eintrag gibt.
  test-before-configure:
    status: done
    comment: Vor dem Speichern fragt die Maske xAI nach dem Schlüssel (ohne Kosten; antwortet xAI nicht, wird gespeichert), liest die Zeilen der Angaben und rendert Begrüßung und Anweisung streng. Die Anmeldung an der Türstation probt sie nicht (das bräuchte den Port der laufenden Innenstation); ob sie gilt, zeigt der Neustart von Grok Voice gleich nach dem Speichern (Stand in der Maske, Sensor „Empfang Störung“).
  test-before-setup:
    status: done
    comment: Schlüssel, Station oder Passwort fehlen oder Port belegt → Warnung im Log, Sensor „Empfang Störung“ an. Ist der Name der Station nicht auflösbar, versucht es die Anmeldung weiter (Störung nach 3 min). Den Schlüssel prüft die Integration gleich beim Start bei xAI.
  unique-config-entry:
    status: done
    comment: single_config_entry und feste unique_id.
  # --- Silber ---
  action-exceptions:
    status: done
    comment: tuer_assistent.auflegen wirft nur, wenn Auflegen gar nicht geht (HomeAssistantError mit Übersetzung); ohne Gespräch geschieht nichts. Die Automation ruft mit continue_on_error.
  config-entry-unloading:
    status: done
    comment: Die Entitäten werden entladen und die Innenstation hält an (meldet sich an der Station ab); so auch beim Neuladen nach geänderten Optionen.
  docs-configuration-parameters:
    status: done
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: exempt
    comment: Der Sensor meldet die Störung selbst (an, mit Grund); „nicht verfügbar“ würde die Plakette verschlucken.
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: Anmeldung verloren und wieder da, Schlüssel abgelehnt und wieder gut, je einmal im Log.
  parallel-updates:
    status: done
  reauthentication-flow:
    status: exempt
    comment: Ein abgelehnter Schlüssel erscheint unter Reparaturen mit dem Weg zu „Konfigurieren“; dort ein neuer Schlüssel, Grok Voice startet ohne Neustart neu. Ein eigener Ablauf wäre derselbe Weg doppelt.
  test-coverage:
    status: todo
    comment: Verlangt sind über 95 % in jedem Modul. Gemessen am 14.11.2026 mit pytest-cov über die Prüfungen des Tür-Assistenten (Prüfstand der Anlage, gestellte Station, gestelltes xAI) 96 % insgesamt; über 95 % liegen alle Module des Wegs über Grok Voice (sprache.py 95,5 %, __init__.py 98 %, die übrigen 100 %), darunter nur die drei des alten Text-Wegs (conversation.py 93 %, tts.py 90 %, stt.py 89 %).
  # --- Gold ---
  devices:
    status: done
    comment: Ein Gerät „Empfang“ (Dienst) für alle Entitäten.
  diagnostics:
    status: done
    comment: diagnostics.py, ohne Schlüssel, Passwort, Adresse, Namen und Mitschriften; mit dem Tagebuch der letzten Rufe.
  discovery:
    status: exempt
    comment: Eine Station, fest eingetragen; ihr Passwort lässt sich nicht finden.
  discovery-update-info:
    status: exempt
    comment: Wie discovery.
  docs-data-update:
    status: done
  docs-examples:
    status: done
    comment: Ordner beispiele im Projekt (configuration.yaml, Automationen); die Anweisung steht als Vorgabe in vorgabe.py und vorbelegt in der Maske.
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: done
  dynamic-devices:
    status: exempt
    comment: Genau ein Gerät.
  entity-category:
    status: done
    comment: Störung = Diagnose, Wahl der KI = Einstellung.
  entity-device-class:
    status: done
    comment: Störung = problem.
  entity-disabled-by-default:
    status: done
    comment: Erkennung, Stimme und Agent gehören zum Weg über einen VoIP Stack und sind bei neuen Einrichtungen aus; Grok Voice braucht sie nicht.
  entity-translations:
    status: done
    comment: Namen deutsch und englisch in translations/.
  exception-translations:
    status: done
    comment: Der eine Fehler (Auflegen nicht möglich) deutsch und englisch in translations/.
  icon-translations:
    status: done
    comment: Symbole der Entitäten und des Dienstes in icons.json.
  reconfiguration-flow:
    status: exempt
    comment: Alle Einstellungen liegen in den Optionen („Konfigurieren“) und gelten ohne Neustart; ein zweiter Weg zu denselben Feldern wäre doppelt.
  repair-issues:
    status: done
    comment: xAI-Schlüssel abgelehnt oder gesperrt; Anmeldung an der Station verloren (beide verschwinden von selbst); dass Mitschriften gespeichert werden (Warnung, lässt sich ignorieren); dass der Block grok_voice in configuration.yaml weg kann (Warnung, verschwindet ohne ihn).
  stale-devices:
    status: exempt
    comment: Genau ein Gerät.
  # --- Platin ---
  async-dependency:
    status: done
    comment: Keine fremden Pakete, alles asyncio.
  inject-websession:
    status: done
    comment: Die Sitzung von Home Assistant (async_get_clientsession).
  strict-typing:
    status: exempt
    comment: Typangaben stehen an den Schnittstellen; eine strenge Prüfung mit mypy läuft im Prüfstand der Anlage nicht.
